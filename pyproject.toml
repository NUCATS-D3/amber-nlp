[project]
name = "amber"
version = "0.0.0"
description = "Contracts, validation, interfaces, and MLflow plugins for evidence-grounded clinical information extraction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Will Thompson" }]

# Core: contract models, canonical IDs, exact grounding, and evidence validation only.
dependencies = [
    "pydantic>=2.9",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
# MLflow plugins (OSS API only); range follows loupe's tested MLflow release.
tracking = [
    "mlflow>=3.17,<3.18",
]
# Parquet bundle files; the bundle model, hashing, and validation need only the core.
bundles = [
    "pyarrow>=17",
]
# The synthetic reference implementations (amber.reference) ship with the core and are for
# synthetic data only; this extra adds what all of them need (LocalExporter writes Parquet).
reference = [
    "amber[bundles]",
]
# The conformance kit's pytest plugin; the rest of the kit needs only the core.
conformance = [
    "pytest>=8",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit",
    "hypothesis",
    "import-linter>=2.15",
]

# MLflow discovers run-context providers through this entry-point group.
[project.entry-points."mlflow.run_context_provider"]
amber = "amber.mlflow_ext.context:AmberRunContextProvider"

# pytest discovers the conformance plugin here; it is inert without --amber-conformance.
[project.entry-points.pytest11]
amber_conformance = "amber.conformance.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amber"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.ruff]
extend-exclude = ["docs", "examples"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PIE", "ERA"]
# Keep explicit TypeAlias Literals; PEP 695 aliases change runtime introspection of Pydantic fields.
ignore = ["UP040"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that need a long-running external resource"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Dependency direction (AGENTS.md "Layout and dependency direction"); run `uv run lint-imports`.
[tool.importlinter]
root_package = "amber"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core imports only pydantic, python-ulid, and the standard library"
type = "forbidden"
source_modules = [
    "amber.schemas",
    "amber.ids",
    "amber.grounding",
    "amber.graph",
    "amber.graph_errors",
    "amber._graph_validation",
    "amber.cases",
    "amber.tools",
]
forbidden_modules = [
    "mlflow",
    "pyarrow",
    "pytest",
    "hypothesis",
    "amber.annotations",
    "amber.examples",
    "amber.labels",
    "amber.interfaces",
    "amber.policy",
    "amber.providers",
    "amber.extraction",
    "amber.scoring",
    "amber.span_scoring",
    "amber.regression",
    "amber.evaluation",
    "amber.labeling",
    "amber.review",
    "amber.rules",
    "amber.wire",
    "amber.bundles",
    "amber.mlflow_ext",
    "amber.conformance",
    "amber.reference",
    "amber.loupe",
]
broken_contract_guidance = "Move the dependency out of the core, or into a plugin that imports the core."

[[tool.importlinter.contracts]]
name = "The framework never imports a plugin or an optional stack, even indirectly"
type = "forbidden"
source_modules = [
    "amber.schemas",
    "amber.ids",
    "amber.grounding",
    "amber.graph",
    "amber.graph_errors",
    "amber._graph_validation",
    "amber.cases",
    "amber.tools",
    "amber.annotations",
    "amber.examples",
    "amber.labels",
    "amber.interfaces",
    "amber.policy",
    "amber.providers",
    "amber.extraction",
    "amber.scoring",
    "amber.span_scoring",
    "amber.regression",
    "amber.evaluation",
    "amber.labeling",
    "amber.review",
    "amber.rules",
    "amber.wire",
    "amber.bundles.core",
    "amber.bundles.schema",
]
forbidden_modules = [
    "mlflow",
    "pyarrow",
    "pytest",
    "hypothesis",
    "amber.mlflow_ext",
    "amber.bundles.parquet",
    "amber.conformance",
    "amber.reference",
    "amber.loupe",
]
broken_contract_guidance = "Plugins import the framework, never the reverse; load optional stacks only at a plugin boundary."

[[tool.importlinter.contracts]]
name = "import amber and import amber.bundles load no plugin or optional stack"
type = "forbidden"
as_packages = false
source_modules = ["amber", "amber.bundles"]
forbidden_modules = [
    "mlflow.**",
    "pyarrow.**",
    "pytest",
    "hypothesis",
    "amber.mlflow_ext",
    "amber.mlflow_ext.**",
    "amber.bundles.parquet",
    "amber.conformance",
    "amber.conformance.**",
    "amber.reference",
    "amber.reference.**",
    "amber.loupe",
    "amber.loupe.**",
]
