[project]
name = "amber"
version = "0.0.0"
description = "Messy clinical text hardened into structured data with the evidence preserved as inclusions: grounded extraction agents, evidence DAGs, MLflow end to end."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Will Thompson" }]

# Core: data model, grounding, tables, MLflow surface. Nothing here needs a GPU or a model.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy",
    "scipy",
    "scikit-learn",
    "rapidfuzz>=3.9",          # quote(): fuzzy alignment
    "python-ulid>=2.7",
    "pyyaml",
    "click",
    "rich",
    "tqdm",
    "mlflow>=3.5",             # optimize_prompts (GEPA) needs >=3.5; OSS surface only
]

[project.optional-dependencies]
# Agent runtime. Model-agnostic; talks to any OpenAI-compatible endpoint.
agents = [
    "pydantic-ai>=1.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=1.0",
]
# Deterministic tool belt (non-LLM NLP).
nlp = [
    "spacy>=3.7,<4",
    "medspacy>=1.3",
    "negspacy>=1.0",
    "gliner>=0.2.20",
    "sentence-transformers>=3.0",   # SapBERT via sentence-transformers or raw transformers
    "rank-bm25>=0.2",
    "dateparser>=1.2",
]
# Optional span-first extraction (SpanTask) and its grounding.
langextract = ["langextract>=1.6"]
# Fine-tuning and in-process inference on CPU/GPU (transformers stack).
train = [
    "torch>=2.4",
    "transformers>=4.51.3,<5",   # TRL<=0.24 mis-tokenizes prompt/completion pairs under transformers 5 (silently breaks completion-only loss)
    "peft>=0.18",
    "trl>=0.18.2,<=0.24",
    "accelerate>=0.34",
    "datasets>=3.4,<4.4",
    "sentencepiece",
]
# Apple silicon: training + inference + schema-constrained decoding.
mlx = [
    "mlx-lm>=0.28; sys_platform == 'darwin'",
    "outlines>=1.0",
]
# GPU serving and fast fine-tuning.
gpu = [
    "vllm>=0.10; sys_platform == 'linux'",
    "unsloth>=2025.9; sys_platform == 'linux'",
    "bitsandbytes>=0.45.5,!=0.46.0,!=0.48.0; sys_platform == 'linux'",
]
# Annotation app backend.
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart",
]
# Orchestration.
dagster = ["dagster>=1.8", "dagster-mlflow"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit",
    "hypothesis",
]

[project.scripts]
amber = "amber.cli:cli"

# MLflow discovers run-context providers through this entry-point group.
[project.entry-points."mlflow.run_context_provider"]
amber = "amber.mlflow_ext.context:AmberRunContextProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amber"]

[tool.uv]
# Resolve for both laptops and Linux GPU boxes; mlx and gpu extras are platform-marked above.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# These two extras are never installed together.
conflicts = [[{ extra = "mlx" }, { extra = "gpu" }]]

[tool.ruff]
extend-exclude = ["docs", "examples"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that load a model", "gpu: tests that need CUDA", "mlx: tests that need Apple silicon"]
