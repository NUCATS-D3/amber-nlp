<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- step boxes: x positions 20, 250, 480, 710, 940; width 190 -->
  <g font-size="16" text-anchor="middle">
    <rect x="20" y="60" width="190" height="150" rx="12" fill="#eef3f7" stroke="#2f5d7c" stroke-width="2.5"/>
    <text x="115" y="95" font-size="22" font-weight="bold" fill="#2f5d7c">1. Register</text>
    <text x="115" y="125" fill="#333">dataset + task</text>
    <text x="115" y="150" fill="#333">with sensitivity</text>
    <text x="115" y="192" font-size="15" fill="#2f5d7c" font-weight="bold">lapidary</text>

    <rect x="250" y="60" width="190" height="150" rx="12" fill="#eef3f7" stroke="#2f5d7c" stroke-width="2.5"/>
    <text x="345" y="95" font-size="22" font-weight="bold" fill="#2f5d7c">2. Extract</text>
    <text x="345" y="125" fill="#333">rules, models,</text>
    <text x="345" y="150" fill="#333">or LLM agents</text>
    <text x="345" y="192" font-size="15" fill="#2f5d7c" font-weight="bold">lapidary + copal</text>

    <rect x="480" y="60" width="190" height="150" rx="12" fill="#fff4dc" stroke="#d08a00" stroke-width="3"/>
    <text x="575" y="95" font-size="22" font-weight="bold" fill="#b36f00">3. Validate</text>
    <text x="575" y="125" fill="#333">grounding, graph,</text>
    <text x="575" y="150" fill="#333">then score</text>
    <text x="575" y="192" font-size="15" fill="#b36f00" font-weight="bold">amber</text>

    <rect x="710" y="60" width="190" height="150" rx="12" fill="#f1edf6" stroke="#5b3c88" stroke-width="2.5"/>
    <text x="805" y="95" font-size="22" font-weight="bold" fill="#5b3c88">4. Review</text>
    <text x="805" y="125" fill="#333">clinicians correct</text>
    <text x="805" y="150" fill="#333">and adjudicate</text>
    <text x="805" y="192" font-size="15" fill="#5b3c88" font-weight="bold">loupe</text>

    <rect x="940" y="60" width="190" height="150" rx="12" fill="#f1edf6" stroke="#5b3c88" stroke-width="2.5"/>
    <text x="1035" y="95" font-size="22" font-weight="bold" fill="#5b3c88">5. Publish</text>
    <text x="1035" y="125" fill="#333">a versioned</text>
    <text x="1035" y="150" fill="#333">reference set</text>
    <text x="1035" y="192" font-size="15" fill="#5b3c88" font-weight="bold">loupe → MLflow</text>
  </g>

  <g stroke="#4a4a4a" stroke-width="2.5" fill="none">
    <line x1="210" y1="135" x2="246" y2="135" marker-end="url(#a)"/>
    <line x1="440" y1="135" x2="476" y2="135" marker-end="url(#a)"/>
    <line x1="670" y1="135" x2="706" y2="135" marker-end="url(#a)"/>
    <line x1="900" y1="135" x2="936" y2="135" marker-end="url(#a)"/>
    <!-- feedback loop -->
    <path d="M1035,210 L1035,290 L345,290 L345,214" marker-end="url(#a)"/>
    <path d="M575,290 L575,214" marker-end="url(#a)"/>
  </g>
  <text x="690" y="325" text-anchor="middle" font-size="18" fill="#444">reviewed references score the next run and train or tune the next extractor</text>
  <text x="575" y="40" text-anchor="middle" font-size="16" fill="#777">every step is an MLflow run with its spec, data hash, and policy</text>
</svg>
