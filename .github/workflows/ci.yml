name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-install:
    name: Core install (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.14"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install only the locked core package
        run: uv sync --locked --no-default-groups --no-editable
      - name: Check the installed package without checkout imports
        run: uv run --no-sync python -I scripts/check_core_install.py

  tests:
    name: Synthetic tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.14"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Check lockfile consistency
        run: uv lock --check
      - name: Install the locked test and optional interface dependencies
        run: uv sync --locked --no-editable --extra dev --extra app --extra tracking
      - name: Require optional interfaces before tests can skip them
        run: uv run --no-sync python -c "import fastapi, httpx, mlflow"
      - name: Run offline CPU tests using synthetic inputs only
        run: uv run --no-sync pytest --strict-markers -ra -m "not slow and not gpu and not mlx"
      - name: Lint
        if: matrix.python == '3.11'
        run: uv run --no-sync ruff check .
      - name: Check formatting
        if: matrix.python == '3.11'
        run: uv run --no-sync ruff format --check .
      - name: Type check the supported target
        if: matrix.python == '3.11'
        run: uv run --no-sync mypy src
