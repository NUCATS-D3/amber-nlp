name: CI

on:
  push:
  pull_request:
    # labeled/unlabeled re-run the protected-artifacts check when contract-approved changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-artifacts:
    name: Protected contract artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the contract-approved label for golden, catalog, fixture, or test-assertion changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git diff --unified=0 "$BASE_SHA" HEAD > "$RUNNER_TEMP/changes.diff"
          python3 scripts/check_protected_changes.py "$RUNNER_TEMP/changes.diff" --labels "$LABELS"

  core-install:
    name: Core install (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.14"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install only the locked core package
        run: uv sync --locked --no-default-groups --no-editable
      - name: Check the installed package without checkout imports
        run: uv run --no-sync python -I scripts/check_core_install.py

  tests:
    name: Synthetic tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.14"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Check lockfile consistency
        run: uv lock --check
      - name: Install the locked test and optional interface dependencies
        run: uv sync --locked --no-editable --extra dev --extra tracking --extra bundles
      - name: Require optional plugins before tests can skip them
        run: uv run --no-sync python -c "import mlflow"
      - name: Run offline CPU tests using synthetic inputs only
        run: uv run --no-sync pytest --strict-markers -ra -m "not slow"
      - name: Lint
        if: matrix.python == '3.12'
        run: uv run --no-sync ruff check .
      - name: Check formatting
        if: matrix.python == '3.12'
        run: uv run --no-sync ruff format --check .
      - name: Type check the supported target
        if: matrix.python == '3.12'
        run: uv run --no-sync mypy src
